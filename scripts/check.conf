# scripts/check.conf — LeaveManager doğrulama sözleşmesi (./scripts/check). Bootstrap 2026-11-02.
# One step per line:  <name>: <command>   — runs in order, fails fast.
# Format ve kurallar: scripts/check.conf.example, docs/testing.md (Resource hygiene, Two speeds).
#
# Araç zinciri: JDK 21, her zaman $JAVA_HOME üzerinden (PATH'teki java bu makinede 1.8 —
# docs/conventions.md, Known traps).
requires build: sh -c '"$JAVA_HOME/bin/javac" -version 2>&1 | grep -q "^javac 21"'
#
# resource hygiene: javac arka planda süreç bırakmaz; çıktı her çalıştırmada yeni bir geçici
# dizine yazılır ve aynı adımda silinir (kural 5: sonraki çalıştırmaya veri kalmaz), çıkış kodu korunur.
build [fast]: sh -c 'd=$(mktemp -d) && "$JAVA_HOME/bin/javac" --release 21 -Xlint:all -Werror -encoding UTF-8 -d "$d" src/Main.java; rc=$?; rm -r "$d"; exit $rc'
#
# --- Planlanan adımlar (ilk spec Maven Wrapper + JUnit 5'i kurunca açılır; o zamana kadar yorum) ---
# Yukarıdaki build adımı `./mvnw -B -ntp compile` ile değiştirilir, requires satırı aynı kalır.
# resource hygiene: Maven daemon bırakmaz (mvnd KULLANILMAZ); surefire/failsafe fork'ları test sonunda çıkar.
# Seçici (selector) ile ayrım, liste ile değil: *Test → unit (fast), *IT → entegrasyon (full).
# requires unit: sh -c '"$JAVA_HOME/bin/java" -version 2>&1 | grep -q "version \"21"'
# unit [fast]: ./mvnw -B -ntp surefire:test
# requires integration: sh -c '"$JAVA_HOME/bin/java" -version 2>&1 | grep -q "version \"21"'
# integration: ./mvnw -B -ntp failsafe:integration-test failsafe:verify
# (HTTP entegrasyon testleri sunucuyu port 0'da açar ve finally içinde stop(0) çağırır.)
